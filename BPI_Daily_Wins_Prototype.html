<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BPI Daily Wins</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6.5 12 13l8.5-6.5"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7c2 0 3.700.6 5.200 1.500M22 12s-3.600 7-10 7c-2 0-3.700-.6-5.200-1.500M9.900 9.900a3 3 0 0 0 4.200 4.200M3 3l18 18"/></symbol>
  <symbol id="i-accounts" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11"/></symbol>
  <symbol id="i-move" viewBox="0 0 24 24"><path d="M5 8h14M15 4l4 4-4 4M19 16H5M9 12l-4 4 4 4"/></symbol>
  <symbol id="i-qr" viewBox="0 0 24 24"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><rect x="8" y="8" width="3" height="3" rx=".5"/><rect x="13" y="8" width="3" height="3" rx=".5"/><rect x="8" y="13" width="3" height="3" rx=".5"/><path d="M13.500 14.500h2.500M14.500 13.500v3"/></symbol>
  <symbol id="i-products" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-chev-r" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="i-chev-l" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.500 4.500 4.500L19 7.500"/></symbol>
  <symbol id="i-gift" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7M7.500 8a2.500 2.500 0 1 1 0-5C10 3 12 8 12 8s2-5 4.500-5a2.500 2.500 0 1 1 0 5"/></symbol>
  <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 3c.8 3.200 5.500 5 5.500 10a5.500 5.500 0 0 1-11 0c0-2 .8-3.300 2-4.500 0 1.800.8 3 2 3C10.500 8.500 10.500 5.500 12 3z"/></symbol>
  <symbol id="i-bill" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></symbol>
  <symbol id="i-coins" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.700 3.100 3 7 3s7-1.300 7-3V6M5 12v6c0 1.700 3.100 3 7 3s7-1.300 7-3v-6"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.500A2.500 2.500 0 0 1 6.500 3H20v14H6.500A2.500 2.500 0 0 0 4 19.500z"/><path d="M4 19.500A2.500 2.500 0 0 0 6.500 22H20v-5"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h12v3M3 8v10a2 2 0 0 0 2 2h14a1 1 0 0 0 1-1V9a1 1 0 0 0-1-1H5a2 2 0 0 1-2-2"/><path d="M16 14h2"/></symbol>
  <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
  <symbol id="i-cash" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.500 16V8h3a2 2 0 0 1 0 4h-3M8 10h6M8 12.500h6"/></symbol>
  <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.500 10.900c.6.500 1 1.200 1 2.100h5c0-.9.400-1.600 1-2.100A6 6 0 0 0 12 3z"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M7 12h10"/></symbol>
  <symbol id="i-card" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2.5"/><path d="M2 10h20"/><path d="M5.5 15h4"/></symbol>
</svg>

<main class="stage">
  <aside class="panel" id="panel" aria-label="Prototype guide"></aside>

  <div class="phone" id="phone">
    <div class="status" aria-hidden="true">
      <span>1:11</span>
      <span class="r">
        <svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1" opacity=".3"/><rect x="15" y="0" width="3" height="12" rx="1" opacity=".3"/></svg>
        <svg viewBox="0 0 17 12"><path d="M8.500 2.200c2.400 0 4.600.9 6.300 2.500l1.200-1.300A11.500 11.500 0 0 0 8.500.4C5.400.4 2.600 1.600.5 3.500l1.200 1.300a9.700 9.700 0 0 1 6.800-2.600zm0 3.600c1.400 0 2.700.5 3.700 1.400l1.200-1.300a7.900 7.900 0 0 0-10 0l1.200 1.300c1-.9 2.300-1.400 3.700-1.400zm0 3.500c.6 0 1.100.2 1.500.6L8.500 11.500 7 9.900c.4-.4.900-.6 1.500-.6z"/></svg>
        <span class="batt">43</span>
      </span>
    </div>

    <!-- HOME -->
    <section class="screen white" id="s-home" aria-label="Accounts">
      <div class="scroll" id="homeScroll"><div id="homeBody"></div></div>
      <nav class="nav" aria-label="Main">
        <button class="on" data-act="toast" data-msg="You are on Accounts">
          <svg class="ic" aria-hidden="true"><use href="#i-accounts"/></svg>Accounts</button>
        <button data-act="toast" data-msg="Move money is not part of this prototype">
          <svg class="ic" aria-hidden="true"><use href="#i-move"/></svg>Move money</button>
        <span></span>
        <button data-act="toast" data-msg="Products is not part of this prototype">
          <svg class="ic" aria-hidden="true"><use href="#i-products"/></svg>Products</button>
        <button data-act="more">
          <svg class="ic" aria-hidden="true"><use href="#i-menu"/></svg>More</button>
        <button class="fab" data-act="startQR" aria-label="Scan QR Ph to pay"><svg class="ic" aria-hidden="true"><use href="#i-qr"/></svg></button>
      </nav>
    </section>

    <!-- DAILY WINS HUB -->
    <section class="screen" id="s-hub" aria-label="Daily Wins">
      <div class="appbar">
        <button class="ib" data-act="back" aria-label="Back"><svg class="ic"><use href="#i-chev-l"/></svg></button>
        <h2>Daily Wins</h2>
        <button class="ib" data-act="how" aria-label="How Daily Wins works"><svg class="ic"><use href="#i-info"/></svg></button>
      </div>
      <div class="scroll"><div class="stack" id="hubBody"></div></div>
    </section>

    <!-- QR SCANNER -->
    <section class="screen scan" id="s-scan" aria-label="Scan QR Ph">
      <div class="appbar">
        <button class="ib" data-act="back" aria-label="Close"><svg class="ic"><use href="#i-x"/></svg></button>
        <h2>Scan QR Ph</h2>
        <span class="ib"></span>
      </div>
      <div class="scan-view">
        <div class="scan-banner" id="scanBanner"></div>
        <div class="vf"><i></i><i></i><i></i><i></i></div>
        <p>Point your camera at a QR Ph code to pay.</p>
      </div>
      <div class="foot"><button class="btn btn-light btn-block" data-act="scan">Simulate scanning a QR Ph code</button></div>
    </section>

    <!-- PAY (QR / bill / save) -->
    <section class="screen" id="s-pay" aria-label="Payment">
      <div class="appbar">
        <button class="ib" data-act="back" aria-label="Back"><svg class="ic"><use href="#i-chev-l"/></svg></button>
        <h2 id="payTitle">Pay</h2>
        <span class="ib"></span>
      </div>
      <div class="scroll"><div class="stack" id="payBody"></div></div>
      <div class="foot" id="payFoot"></div>
    </section>

    <!-- LEARN -->
    <section class="screen" id="s-learn" aria-label="Money tip">
      <div class="appbar">
        <button class="ib" data-act="back" aria-label="Back"><svg class="ic"><use href="#i-chev-l"/></svg></button>
        <h2>1-minute tip</h2>
        <span class="ib"></span>
      </div>
      <div class="scroll"><div class="stack" id="learnBody"></div></div>
      <div class="foot" id="learnFoot"></div>
    </section>

    <!-- SUCCESS -->
    <section class="screen" id="s-success" aria-label="Success">
      <div class="scroll"><div class="stack" id="sucBody"></div></div>
      <div class="foot" id="sucFoot"></div>
    </section>

    <!-- REDEEM -->
    <section class="screen" id="s-redeem" aria-label="Convert points">
      <div class="appbar">
        <button class="ib" data-act="back" aria-label="Back"><svg class="ic"><use href="#i-chev-l"/></svg></button>
        <h2>Convert to cashback</h2>
        <span class="ib"></span>
      </div>
      <div class="scroll"><div class="stack" id="redeemBody"></div></div>
      <div class="foot" id="redeemFoot"></div>
    </section>

    <!-- REDEEM DONE -->
    <section class="screen" id="s-done" aria-label="Cashback credited">
      <div class="scroll"><div class="stack" id="doneBody"></div></div>
      <div class="foot" id="doneFoot"></div>
    </section>

    <!-- SUPPLEMENTARY CARD -->
    <section class="screen" id="s-supp" aria-label="Supplementary card">
      <div class="appbar">
        <button class="ib" data-act="back" aria-label="Back"><svg class="ic"><use href="#i-chev-l"/></svg></button>
        <h2>Supplementary card</h2>
        <span class="ib"></span>
      </div>
      <div class="scroll"><div class="stack" id="suppBody"></div></div>
      <div class="foot" id="suppFoot"></div>
    </section>

    <div class="sheet-wrap" id="sheet" aria-hidden="true">
      <div class="scrim" data-act="closeSheet"></div>
      <div class="sheet" role="dialog" aria-modal="true" id="sheetBody"></div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
</main>

<!-- Plain classic scripts (no type="module"), loaded in dependency order,
     so this still runs by double-clicking the file — no server needed. -->
<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/nav.js"></script>
<script src="js/screen-home.js"></script>
<script src="js/screen-hub.js"></script>
<script src="js/screen-pay.js"></script>
<script src="js/screen-learn.js"></script>
<script src="js/screen-success.js"></script>
<script src="js/screen-redeem.js"></script>
<script src="js/screen-supp.js"></script>
<script src="js/guide.js"></script>
<script src="js/actions.js"></script>
<script src="js/main.js"></script>
</body>
</html>
